# Gaux Equalizer - compila, prueba y crea los instaladores de Mac y Windows.
# Se ejecuta solo cuando cambia el codigo (rama main), a mano (pestana Actions > Instaladores > "Run workflow")
# o al crear una etiqueta vX.Y.Z (entonces ademas publica una Release con los dos zip para descargar).
name: Instaladores

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instaladores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    name: Mac (universal)
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas del motor de sonido
        run: |
          clang++ -std=c++17 -O2 -I Source Tests/DspTests.cpp -o dsptests
          ./dsptests

      - name: Compilar y crear el instalador
        run: |
          set -o pipefail
          bash package_mac.sh 2>&1 | tee build.log

      - name: Mostrar los errores de compilacion
        if: failure()
        run: |
          msg=$( (grep -E "error:|Error|ERROR|FAILED" build.log | head -20; echo "----- final del registro -----"; tail -n 30 build.log) | cut -c1-400 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Errores de Mac::$msg"

      - name: Instalar el .pkg (como lo haria un usuario)
        run: |
          sudo installer -pkg "$(ls dist/*/Gaux\ Equalizer.pkg)" -target /
          ls -la "/Library/Audio/Plug-Ins/VST3/" "/Library/Audio/Plug-Ins/Components/"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -v aufx Gxeq Gaux

      - uses: actions/upload-artifact@v4
        with:
          name: GauxEQ-Mac
          path: dist/*.zip
          if-no-files-found: error

      # (pluginval para Mac viene compilado para Intel: en las maquinas Apple Silicon de GitHub corre traducido
      #  y es lento; por eso se prueba en menos combinaciones que en Windows, con un limite de tiempo por formato)
      - name: Validar con pluginval, nivel maximo (VST3 y AU)
        timeout-minutes: 30
        run: |
          curl -fsSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          bash .github/scripts/pluginval_mac.sh "/Library/Audio/Plug-Ins/VST3/Gaux Equalizer.vst3" vst3 --strictness-level 10 --skip-gui-tests --timeout-ms 300000 --sample-rates 44100,96000 --block-sizes 64,1024
          bash .github/scripts/pluginval_mac.sh "/Library/Audio/Plug-Ins/Components/Gaux Equalizer.component" au --strictness-level 10 --skip-gui-tests --timeout-ms 300000 --sample-rates 48000 --block-sizes 512

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar y crear el instalador
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File package_windows.ps1 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit 1 }

      - name: Mostrar los errores de compilacion
        if: failure()
        shell: pwsh
        run: |
          $e = Select-String -Path build.log -Pattern ' error |error C|fatal error|Fallo|No se genero' | Select-Object -First 25 | ForEach-Object { $_.Line.Trim() }
          $msg = ($e -join '%0A')
          Write-Output "::error title=Errores de Windows::$msg"

      - name: Pruebas del motor de sonido (compilador de Windows)
        shell: pwsh
        run: |
          cmake --build build-package --config Release --target GauxDspTests
          & (Get-ChildItem -Recurse -Filter GauxDspTests.exe build-package | Select-Object -First 1).FullName
          if ($LASTEXITCODE) { exit 1 }

      - name: Instalar (como lo haria un usuario, en modo silencioso)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem -Recurse -Filter *_Windows_Setup.exe dist | Select-Object -First 1).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-'
          if (-not (Test-Path "$env:CommonProgramFiles\VST3\Gaux Equalizer.vst3\Contents\x86_64-win\Gaux Equalizer.vst3")) { throw 'El instalador no dejo el VST3 en su lugar' }

      - name: Validar con pluginval, nivel maximo (VST3)
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pv
          $pv = (Get-ChildItem -Recurse -Filter pluginval.exe pv | Select-Object -First 1).FullName
          # (pluginval es una app con ventana: se espera a que termine y se revisa que diga SUCCESS)
          $args = @('--strictness-level','10','--repeat','2','--randomise','--skip-gui-tests','--timeout-ms','900000',
                    '--sample-rates','44100,48000,96000,192000','--block-sizes','16,64,256,1024,4096',
                    '--validate', "`"$env:CommonProgramFiles\VST3\Gaux Equalizer.vst3`"")
          $p = Start-Process -FilePath $pv -ArgumentList $args -Wait -PassThru -NoNewWindow -RedirectStandardOutput pv.log -RedirectStandardError pv_err.log
          Get-Content pv.log -Tail 8
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path pv.log -Pattern 'SUCCESS' -Quiet)) {
              $t = (Get-Content pv.log -Tail 40) -join '%0A'
              Write-Output "::error title=pluginval Windows::$t"
              exit 1
          }

      - name: Desinstalar (comprobar que no deja restos)
        shell: pwsh
        run: |
          $u = Get-ChildItem "${env:ProgramFiles}\Gaux\Gaux Equalizer\unins*.exe" | Select-Object -First 1
          Start-Process -Wait -FilePath $u.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART'
          Start-Sleep -Seconds 3
          if (Test-Path "$env:CommonProgramFiles\VST3\Gaux Equalizer.vst3") { throw 'El desinstalador dejo el VST3' }

      - uses: actions/upload-artifact@v4
        with:
          name: GauxEQ-Windows
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publicar Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: paquetes
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: paquetes/*.zip
          body: |
            Gaux Equalizer ${{ github.ref_name }}
            - Mac (Apple Silicon e Intel): GauxEQ_..._Mac.zip
            - Windows 10/11 64 bits: GauxEQ_..._Windows.zip
            Lee "ANTES DE INSTALAR" dentro de cada zip.
